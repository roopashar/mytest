name: Platform Release Monitor

# Runs daily at 08:00 UTC. Also manually triggerable for testing.
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — log findings but do not send notifications"
        type: boolean
        default: false

# Only one run at a time to avoid duplicate notifications.
concurrency:
  group: platform-release-monitor
  cancel-in-progress: false

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # Job 1: Query endoflife.date for every platform in platforms.yaml
  # ────────────────────────────────────────────────────────────────────────────
  endoflife-check:
    name: Check endoflife.date
    runs-on: ubuntu-latest
    outputs:
      findings: ${{ steps.scan.outputs.findings }}
      has_findings: ${{ steps.scan.outputs.has_findings }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pyyaml python-dateutil

      - name: Load known state
        run: |
          if [ -f .github/platform-monitor/known-state.json ]; then
            echo "State file found"
          else
            mkdir -p .github/platform-monitor
            echo "{}" > .github/platform-monitor/known-state.json
            echo "State file initialised (first run)"
          fi

      - name: Scan endoflife.date
        id: scan
        env:
          EOL_API: "https://endoflife.date/api"
        run: |
          python3 - <<'PYEOF'
          import json, os, requests, yaml
          from datetime import date
          from dateutil.parser import parse as parse_date
          from collections import defaultdict

          PLATFORMS_FILE = "platforms.yaml"
          STATE_FILE     = ".github/platform-monitor/known-state.json"
          EOL_API        = os.environ["EOL_API"]
          TODAY          = date.today()

          with open(PLATFORMS_FILE) as f:
              config = yaml.safe_load(f)

          with open(STATE_FILE) as f:
              state = json.load(f)

          defaults  = config.get("defaults", {})
          platforms = config.get("platforms", [])
          findings  = []
          new_state = {}

          by_id = defaultdict(list)
          for p in platforms:
              by_id[p["id"]].append(p)

          for product_id, entries in by_id.items():
              try:
                  r = requests.get(f"{EOL_API}/{product_id}.json", timeout=15)
                  r.raise_for_status()
                  api_cycles = {str(c["cycle"]): c for c in r.json()}
              except Exception as e:
                  print(f"[WARN] Could not fetch {product_id}: {e}")
                  continue

              for entry in entries:
                  cycle     = str(entry["cycle"])
                  label     = entry["label"]
                  warn_days = entry.get("eol_warn_days", defaults.get("eol_warn_days", 180))
                  track_new = entry.get("track_new_releases", False)
                  state_key = f"{product_id}:{cycle}"
                  prev      = state.get(state_key, {})

                  # ── Detect new cycles in the API not yet in platforms.yaml ──
                  if track_new:
                      known_cycles = {e["cycle"] for e in entries if e["id"] == product_id}
                      for api_cycle_str, api_cycle_data in api_cycles.items():
                          new_key = f"{product_id}:{api_cycle_str}"
                          if api_cycle_str not in known_cycles and new_key not in state:
                              findings.append({
                                  "type":     "new_release",
                                  "priority": "P0" if api_cycle_data.get("lts") else "P1",
                                  "product":  product_id,
                                  "cycle":    api_cycle_str,
                                  "label":    f"{label.rsplit(' ', 1)[0]} {api_cycle_str}",
                                  "eol":      str(api_cycle_data.get("eol", "unknown")),
                                  "lts":      api_cycle_data.get("lts", False),
                                  "summary":  f"New release detected: {product_id} {api_cycle_str}",
                              })
                              new_state[new_key] = {"seen": str(TODAY), "notified_new": True}

                  # ── Check EOL proximity for our tracked cycle ───────────────
                  if cycle not in api_cycles:
                      new_state[state_key] = prev
                      continue

                  api_data = api_cycles[cycle]
                  eol_raw  = api_data.get("eol")
                  new_state[state_key] = {"eol": str(eol_raw), "seen": str(TODAY)}

                  if not eol_raw or eol_raw is True or eol_raw is False:
                      continue

                  try:
                      eol_date = parse_date(str(eol_raw)).date()
                  except Exception:
                      continue

                  days_remaining = (eol_date - TODAY).days

                  if days_remaining <= 30 and prev.get("notified_p0") != str(eol_date):
                      findings.append({
                          "type":           "eol_critical",
                          "priority":       "P0",
                          "product":        product_id,
                          "cycle":          cycle,
                          "label":          label,
                          "eol":            str(eol_date),
                          "days_remaining": days_remaining,
                          "summary":        f"EOL CRITICAL ({days_remaining}d): {label} reaches end-of-life {eol_date}",
                      })
                      new_state[state_key]["notified_p0"] = str(eol_date)

                  elif days_remaining <= warn_days and prev.get("notified_eol_warn") != str(eol_date):
                      findings.append({
                          "type":           "eol_warning",
                          "priority":       "P1",
                          "product":        product_id,
                          "cycle":          cycle,
                          "label":          label,
                          "eol":            str(eol_date),
                          "days_remaining": days_remaining,
                          "summary":        f"EOL Warning ({days_remaining}d): {label} EOL {eol_date}",
                      })
                      new_state[state_key]["notified_eol_warn"] = str(eol_date)

          merged = {**state, **new_state}
          with open(STATE_FILE, "w") as f:
              json.dump(merged, f, indent=2, default=str)

          print(f"Findings: {len(findings)}")
          for f in findings:
              print(f"  [{f['priority']}] {f['summary']}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as gh:
              gh.write(f"findings={json.dumps(findings)}\n")
              gh.write(f"has_findings={'true' if findings else 'false'}\n")
          PYEOF

      - name: Commit updated state file
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/platform-monitor/known-state.json
          git diff --staged --quiet || git commit -m "chore: update platform monitor state [skip ci]" && git push || true

  # ────────────────────────────────────────────────────────────────────────────
  # Job 2: Watch AWS Lambda runtime deprecations via RSS
  # ────────────────────────────────────────────────────────────────────────────
  aws-lambda-runtime-watch:
    name: AWS Lambda runtime RSS watch
    runs-on: ubuntu-latest
    outputs:
      findings: ${{ steps.rss.outputs.findings }}
      has_findings: ${{ steps.rss.outputs.has_findings }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests feedparser

      - name: Parse AWS Lambda deprecation feed
        id: rss
        run: |
          python3 - <<'PYEOF'
          import json, os, feedparser, hashlib

          FEED_URL   = "https://aws.amazon.com/new/feed/"
          KEYWORDS   = ["lambda", "runtime", "deprecat", "end of support", "end-of-support"]
          STATE_FILE = ".github/platform-monitor/lambda-rss-state.json"

          try:
              with open(STATE_FILE) as f:
                  seen_ids = set(json.load(f))
          except FileNotFoundError:
              seen_ids = set()

          feed     = feedparser.parse(FEED_URL)
          findings = []
          new_seen = set(seen_ids)

          for entry in feed.entries:
              combined = (entry.get("title","") + " " + entry.get("summary","")).lower()
              if any(kw in combined for kw in KEYWORDS):
                  uid = entry.get("id") or hashlib.md5(entry.get("link","").encode()).hexdigest()
                  if uid not in seen_ids:
                      findings.append({
                          "type":     "lambda_runtime_news",
                          "priority": "P1",
                          "product":  "aws-lambda",
                          "cycle":    "runtime",
                          "label":    entry.get("title", "AWS Lambda runtime update"),
                          "url":      entry.get("link", ""),
                          "summary":  f"AWS Lambda runtime news: {entry.get('title','')}",
                      })
                      new_seen.add(uid)

          with open(STATE_FILE, "w") as f:
              json.dump(list(new_seen), f, indent=2)

          print(f"Lambda RSS findings: {len(findings)}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as gh:
              gh.write(f"findings={json.dumps(findings)}\n")
              gh.write(f"has_findings={'true' if findings else 'false'}\n")
          PYEOF

      - name: Commit updated Lambda RSS state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/platform-monitor/lambda-rss-state.json
          git diff --staged --quiet || git commit -m "chore: update lambda RSS state [skip ci]" && git push || true

  # ────────────────────────────────────────────────────────────────────────────
  # Job 3: Format and write the findings digest
  #   Writes findings-digest.json as a workflow artifact so the notification
  #   job (Slack, email, or both) can consume it without re-computing anything.
  # ────────────────────────────────────────────────────────────────────────────
  build-digest:
    name: Build findings digest
    runs-on: ubuntu-latest
    needs: [endoflife-check, aws-lambda-runtime-watch]
    if: |
      needs.endoflife-check.outputs.has_findings == 'true' ||
      needs.aws-lambda-runtime-watch.outputs.has_findings == 'true'
    outputs:
      digest_json: ${{ steps.digest.outputs.digest_json }}
      p0_count: ${{ steps.digest.outputs.p0_count }}
      p1_count: ${{ steps.digest.outputs.p1_count }}
      total_count: ${{ steps.digest.outputs.total_count }}

    steps:
      - name: Build digest
        id: digest
        env:
          FINDINGS_EOL:    ${{ needs.endoflife-check.outputs.findings }}
          FINDINGS_LAMBDA: ${{ needs.aws-lambda-runtime-watch.outputs.findings }}
          CONFLUENCE_URL:  "https://aembit.atlassian.net/wiki/spaces/ENGINEERIN/pages/1795031044/Edge+Platform+Compatibility+Matrix"
          RUN_URL:         "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          python3 - <<'PYEOF'
          import json, os
          from datetime import date

          all_findings = []
          for raw in [os.environ.get("FINDINGS_EOL","[]"), os.environ.get("FINDINGS_LAMBDA","[]")]:
              try:
                  all_findings.extend(json.loads(raw))
              except Exception:
                  pass

          # Sort: P0 first, then P1, then by summary
          priority_order = {"P0": 0, "P1": 1, "P2": 2, "P3": 3}
          all_findings.sort(key=lambda f: (priority_order.get(f.get("priority","P3"), 9), f.get("summary","")))

          p0 = [f for f in all_findings if f.get("priority") == "P0"]
          p1 = [f for f in all_findings if f.get("priority") == "P1"]

          digest = {
              "date":          str(date.today()),
              "total":         len(all_findings),
              "p0_count":      len(p0),
              "p1_count":      len(p1),
              "findings":      all_findings,
              "confluence_url": os.environ["CONFLUENCE_URL"],
              "run_url":       os.environ["RUN_URL"],
          }

          digest_json = json.dumps(digest)
          print(f"Digest: {len(all_findings)} findings ({len(p0)} P0, {len(p1)} P1)")

          with open(os.environ["GITHUB_OUTPUT"], "a") as gh:
              gh.write(f"digest_json={digest_json}\n")
              gh.write(f"p0_count={len(p0)}\n")
              gh.write(f"p1_count={len(p1)}\n")
              gh.write(f"total_count={len(all_findings)}\n")

          # Also write as artifact for downstream jobs
          with open("findings-digest.json", "w") as f:
              json.dump(digest, f, indent=2)
          PYEOF

      - name: Upload findings digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: findings-digest
          path: findings-digest.json
          retention-days: 30

