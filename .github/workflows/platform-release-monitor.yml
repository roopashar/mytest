  # ────────────────────────────────────────────────────────────────────────────
  # Job 6: Always-on summary in the Actions run log
  #   Visible in every run regardless of dry_run — gives a clear audit trail.
  # ────────────────────────────────────────────────────────────────────────────
  run-summary:
    name: Run summary
    runs-on: ubuntu-latest
    needs: [endoflife-check, aws-lambda-runtime-watch]
    if: always()

    steps:
      - name: Print findings summary
        env:
          FINDINGS_EOL:    ${{ needs.endoflife-check.outputs.findings }}
          FINDINGS_LAMBDA: ${{ needs.aws-lambda-runtime-watch.outputs.findings }}
          DRY_RUN:         ${{ inputs.dry_run }}
        run: |
          python3 - <<'PYEOF'
          import json, os
          from datetime import date

          findings = []
          for raw in [os.environ.get("FINDINGS_EOL","[]"), os.environ.get("FINDINGS_LAMBDA","[]")]:
              try:
                  findings.extend(json.loads(raw))
              except Exception:
                  pass

          dry = os.environ.get("DRY_RUN","false").lower() == "true"
          mode = "DRY RUN" if dry else "LIVE"

          p0 = [f for f in findings if f.get("priority") == "P0"]
          p1 = [f for f in findings if f.get("priority") != "P0"]

          print(f"=== Platform Release Monitor [{mode}] — {date.today()} ===\n")
          if not findings:
              print("  No findings today. All platforms within expected ranges.")
          else:
              print(f"  {len(findings)} finding(s): {len(p0)} P0, {len(p1)} P1\n")
              for f in sorted(findings, key=lambda x: x.get("priority","P9")):
                  print(f"  [{f['priority']}] {f['type'].upper()}: {f['summary']}")
              print()
              if dry:
                  print("  Dry run — no notifications sent.")
              else:
                  print("  Notification jobs above show delivery status.")
                  print("  Review findings and triage manually into EDGEX Jira.")
          PYEOF